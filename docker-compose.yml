services:
  yolo-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yolo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    privileged: true
    volumes:
      - ./models:/app/models:ro
      - ./output:/app/output
      - ./images:/app/images:ro
      - ./preprocessing:/app/preprocessing:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      - MODEL_NAME=yolo-epi.pt
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - yolo-net

  yolo-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: yolo-client
    restart: unless-stopped
    volumes:
      - ./images:/client/images:ro
      - ./output:/client/output
    environment:
      - PYTHONPATH=/app
      - API_URL=http://yolo-api:8000
    depends_on:
      yolo-api:
        condition: service_healthy
    networks:
      - yolo-net

  yolo-stream:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yolo-stream
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5000:5000"
    privileged: true
    volumes:
      - ./models:/app/models:ro
      - ./stream:/app/stream
      - ./preprocessing:/app/preprocessing:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      - MODEL_NAME=yolo-epi.pt
      - PYTHONPATH=/app
    command: >
      python3 stream/mjpeg_server.py
      --device 0
      --model models/yolo-epi.pt
      --infer-every 3
      --infer-size 320
      --port 5000
    depends_on:
      - yolo-api
    networks:
      - yolo-net

networks:
  yolo-net:
    driver: bridge
